name: Docs

# Builds the Sphinx docs and publishes them to GitHub Pages. Pages must be
# configured to deploy from GitHub Actions (Settings -> Pages -> Source).
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Build docs
        run: |
          uv sync --frozen --group docs
          uv run --frozen --group docs sphinx-build -b html -W --keep-going docs _site
          # Serve _static verbatim instead of letting Jekyll process it.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
