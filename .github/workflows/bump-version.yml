name: Bump version

# One-click release: sets the project version, commits it to the default
# branch, tags the commit, then runs the Release workflow for that tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: PEP 440 version to release, e.g. 0.2.0 (tagged as v0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.8"

      - name: Bump version, tag, and push
        id: bump
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="$VERSION"
          tag="v$version"

          # uv also prints a canonical version when the input is parseable but
          # not canonical (v0.2.0, 0.3.0-rc); reject those so the tag, the
          # project version, and the wheel metadata always agree.
          canonical=$(uv version --dry-run --short --no-sync "$version")
          if [ "$canonical" != "$version" ]; then
            echo "version '$version' is not canonical PEP 440 (normalizes to '$canonical')" >&2
            exit 1
          fi

          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "tag $tag already exists on origin" >&2
            exit 1
          fi

          uv version --no-sync "$version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release $version" -- pyproject.toml uv.lock
          git tag -a "$tag" -m "Release $version"

          # Atomic: never leave the branch bumped without its tag (or vice versa).
          git push --atomic origin "HEAD:$BRANCH" "refs/tags/$tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: bump
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
