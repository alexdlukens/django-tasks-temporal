[project]
name = "django-tasks-temporal"
version = "0.1.0"
description = "Django tasks backend that runs tasks on Temporal."
readme = "README.md"
authors = [
    { name = "Alexander Lukens", email = "alexdlukens@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<6.2",
    "temporalio>=1.36",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]
docs = [
    "furo>=2025.12.19",
    "sphinx>=9.1.1",
    "sphinx-autodoc-typehints>=3.17.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# Django ships without py.typed: its symbols are Any to mypy.
[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

# Our backend and commands subclass Django's Any-typed bases.
[[tool.mypy.overrides]]
module = "django_tasks_temporal.*"
disallow_subclassing_any = false
